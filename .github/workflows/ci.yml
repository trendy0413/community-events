name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: community_events
          POSTGRES_PASSWORD: community_events
          POSTGRES_DB: community_events
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U community_events"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      # CI-only database in a throwaway container; not a secret.
      DATABASE_URL: postgres://community_events:community_events@localhost:5432/community_events
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (includes the rule-to-test check)
        run: npm run lint
      - run: npm run typecheck
      - name: OpenAPI contract is valid and matches the routes
        run: npm run check:openapi
      - name: Tests (unit + integration on PostgreSQL 16)
        run: npm test
      - name: Mutants (each deliberate break must fail a test)
        run: npm run mutants

  # The README's Docker path, exactly as written: docker-compose.yml, the
  # default DATABASE_URL from src/config.ts, migrate, seed, then all tests.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:up
      - run: npm run migrate
      - run: npm run seed
      - run: npm test

  # The one-command run (SPEC section 15): `docker compose up --build` on a
  # fresh clone, then the same outside checks as the live demo, through the
  # web client's port.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: docker compose up
        run: docker compose up --build --detach
      - name: Wait for the web client to reach the API
        run: |
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/v1/health && exit 0
            sleep 3
          done
          docker compose ps --all
          exit 1
      - name: The web client, its script and its routes load
        run: |
          page=$(curl -fsS http://127.0.0.1:8080/)
          echo "$page" | grep -q '<div id="root">'
          # The fallback would answer index.html for a missing file too, so
          # check the bundle the page loads is real JavaScript.
          script=$(echo "$page" | grep -o 'src="/assets/[^"]*\.js"' | head -1 | cut -d'"' -f2)
          echo "script: $script"
          curl -fsS -o /dev/null -w '%{content_type}\n' "http://127.0.0.1:8080$script" | grep -q javascript
          curl -fsS http://127.0.0.1:8080/proof | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/docs/ | grep -qi 'swagger'
      - name: The API keeps the request id nginx gave it (O1)
        run: |
          id=$(curl -fsS -D - -o /dev/null http://127.0.0.1:8080/v1/health | tr -d '\r' | awk -F': ' 'tolower($1) == "x-request-id" { print $2 }')
          echo "request id: $id"
          [[ "$id" =~ ^[0-9a-f]{32}$ ]]
          docker compose logs api | grep -q "\"reqId\":\"$id\""
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Outside checks, as on the live demo
        run: npm run smoke
        env:
          SMOKE_URL: http://127.0.0.1:8080
      - name: Count check against the compose database (O3)
        run: npm run check:counts
        env:
          DATABASE_URL: postgres://community_events:community_events@127.0.0.1:15432/community_events
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down --volumes

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint (includes the W1 rule)
        run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Generated API types match the contract
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run build

  # Development happens on Windows; this catches path and line-ending
  # problems that the Linux job cannot see.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The contract is generated on Windows during development, so the same
      # check here catches output that differs between systems.
      - run: npm run check:openapi
      - run: npm run test:unit
