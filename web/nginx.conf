# The web client in docker compose: the same routes and headers as
# web/vercel.json, with the API at http://api:3000 inside the compose network.

# The request id nginx logs is the one the API logs too (SPEC O1).
log_format with_request_id '$remote_addr [$time_local] "$request" $status $body_bytes_sent request_id=$request_id';

server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log with_request_id;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /v1 {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location /docs {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /openapi.json {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    # File names carry a content hash, so they never change. A location with
    # its own add_header drops the server's, so they are repeated here.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Client-side routes (/events, /supply, /proof...) all load the app.
    location / {
        try_files $uri /index.html;
    }
}
