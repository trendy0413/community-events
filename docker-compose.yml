services:
  db:
    image: postgres:16-alpine
    environment:
      # Local development only. These values are not secrets.
      POSTGRES_USER: community_events
      POSTGRES_PASSWORD: community_events
      POSTGRES_DB: community_events
    ports:
      # Loopback only, and below 49152: Windows often reserves ports above it.
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community_events"]
      interval: 2s
      timeout: 5s
      retries: 20
